    .area { fill: #60a5fa; opacity: .16; }
    .focus { fill: #2563eb; opacity: .24; }
    .label { fill: #334155; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #475569; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #0f172a; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .axis { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .curve { stroke: #60a5fa; }
      .area { fill: #60a5fa; }
      .focus { fill: #3b82f6; }
      .label, .title { fill: #e2e8f0; }
      .small { fill: #cbd5e1; }
    }
  </style>
