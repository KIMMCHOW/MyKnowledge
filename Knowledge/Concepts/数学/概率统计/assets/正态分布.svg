<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">标准正态分布的概率密度曲线</title>
  <desc id="description">均值为零、标准差为一的标准正态分布。均值左右一个标准差之间的面积约为百分之六十八点二七。</desc>
  <style>
    .axis { stroke: #64748b; stroke-width: 1.5; }
