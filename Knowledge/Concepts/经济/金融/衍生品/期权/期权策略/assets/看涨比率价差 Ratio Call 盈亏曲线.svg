  <text x="88" y="36" font-size="24" font-weight="700">看涨正向比率价差 / Call Ratio Spread</text>
  <text x="88" y="64" font-size="15" class="muted">代表构造：1×2（买 1 份 K=95 Call，卖 2 份 K=110 Call）</text>
  <text x="88" y="94" font-size="13" class="muted">示例参数：S₀=100，年化波动率 σ=25%，无风险利率 r=2%，股息率 q=0%；每股损益</text>
  <text x="88" y="116" font-size="13" class="muted">期限：建仓剩 90 天；到期前曲线为剩余 30 天；实线为到期损益</text>
  <text x="88" y="138" font-size="13" class="muted">初始净期权权利金：支出 4.50；忽略交易成本、融资与波动率变化</text>
