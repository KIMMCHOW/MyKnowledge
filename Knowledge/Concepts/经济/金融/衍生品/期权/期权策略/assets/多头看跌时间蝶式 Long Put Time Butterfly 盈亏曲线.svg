  <text x="88" y="36" font-size="24" font-weight="700">多头看跌时间蝶式 / Long Put Time Butterfly</text>
  <text x="88" y="64" font-size="15" class="muted">代表构造（同 K=100）：−May Put +2 June Put −July Put</text>
  <text x="88" y="94" font-size="13" class="muted">示例参数：S₀=100，年化波动率 σ=25%，无风险利率 r=2%，股息率 q=0%；每股损益</text>
  <text x="88" y="116" font-size="13" class="muted">期限：近/中/远月分别 90/120/150 天；更早观察日各剩 30/60/90 天</text>
  <text x="88" y="138" font-size="13" class="muted">初始净期权权利金：支出 0.09；忽略交易成本、融资与波动率变化</text>
