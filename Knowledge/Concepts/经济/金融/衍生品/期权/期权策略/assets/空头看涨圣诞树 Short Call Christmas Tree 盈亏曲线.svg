  <text x="88" y="36" font-size="24" font-weight="700">空头看涨圣诞树 / Short Call Christmas Tree</text>
  <text x="88" y="64" font-size="15" class="muted">代表构造：−C(90)+C(100)+C(110)；上涨端净多 1 份 Call</text>
  <text x="88" y="94" font-size="13" class="muted">示例参数：S₀=100，年化波动率 σ=25%，无风险利率 r=2%，股息率 q=0%；每股损益</text>
