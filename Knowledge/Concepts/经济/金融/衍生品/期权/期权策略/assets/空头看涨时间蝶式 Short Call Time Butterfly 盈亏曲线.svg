  <text x="88" y="36" font-size="24" font-weight="700">空头看涨时间蝶式 / Short Call Time Butterfly</text>
  <text x="88" y="64" font-size="15" class="muted">代表构造（同 K=100）：+May Call −2 June Call +July Call</text>
